name: Nightly Build
on:
  push:
    branches:
      - "**"

jobs:
  catalyst-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: "-O2 -g -target arm64-apple-ios-macabi -miphoneos-version-min=13.1 -flto -fomit-frame-pointer -fno-stack-protector -pipe"
          LDFLAGS: "-Wl,-dead_strip_dylibs"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/catalyst/arm64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D MAC_CATALYST=ON \
            -D BUILD_DEMO=OFF

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: catalyst-arm64
          path: ${{github.workspace}}/dist/**/*

  catalyst-x86_64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: "-O2 -g -target x86_64-apple-ios-macabi -miphoneos-version-min=13.1 -flto -fomit-frame-pointer -fno-stack-protector -pipe"
          LDFLAGS: "-Wl,-dead_strip_dylibs"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/catalyst/x86_64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D MAC_CATALYST=ON \
            -D BUILD_DEMO=OFF

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: catalyst-x86_64
          path: ${{github.workspace}}/dist/**/*

  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: "-O2 -g -target arm64-apple-macos -mmacosx-version-min=10.5 -flto -fomit-frame-pointer -fno-stack-protector -pipe"
          LDFLAGS: "-Wl,-dead_strip_dylibs"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/macos/arm64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: ${{github.workspace}}/dist/**/*

  macos-x86_64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: "-O2 -g -target x86_64-apple-macos -mmacosx-version-min=10.5 -flto -fomit-frame-pointer -fno-stack-protector -pipe"
          LDFLAGS: "-Wl,-dead_strip_dylibs"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/macos/x86_64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64
          path: ${{github.workspace}}/dist/**/*

  linux-arm:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo rm -Rf /etc/apt/sources.list.d
          sudo bash -c 'source /etc/lsb-release && echo "
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME} main universe
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME}-updates main universe
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME}-backports main universe
          # This only seems to be required on GitHub images
          deb [arch=amd64,i386] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu ${DISTRIB_CODENAME} main

          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${DISTRIB_CODENAME} main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${DISTRIB_CODENAME}-updates main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${DISTRIB_CODENAME}-backports main universe
          # This only seems to be required on GitHub images
          deb [arch=arm64,armhf] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu ${DISTRIB_CODENAME} main
          " > /etc/apt/sources.list'

          sudo dpkg --add-architecture armhf
          sudo apt update -m

          sudo apt install -qy \
            binutils-arm-linux-gnueabihf \
            gcc-arm-linux-gnueabihf

          sudo apt install -qy \
            extra-cmake-modules \
            wayland-protocols \
            libx11-dev:armhf \
            libxtst-dev:armhf \
            libxt-dev:armhf \
            libxrandr-dev:armhf \
            libx11-xcb-dev:armhf \
            libxkbcommon-dev:armhf \
            libxkbcommon-x11-dev:armhf \
            libxkbfile-dev:armhf \
            libinput-dev:armhf \
            libudev-dev:armhf \
            libwayland-dev:armhf

      - name: Compile
        env:
          CC: arm-linux-gnueabihf-gcc
          CFLAGS: "-Os -march=armv7ve -mfpu=vfp -mfloat-abi=hard -g -flto -fomit-frame-pointer -fno-stack-protector -pipe"
          LDFLAGS: "-fuse-ld=gold -Wl,-O1 -Wl,--as-needed"
          PKG_CONFIG_PATH: "/usr/lib/arm-linux-gnueabihf/pkgconfig"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/arm \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm
          path: ${{github.workspace}}/dist/**/*

  linux-arm64:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo rm -Rf /etc/apt/sources.list.d/*
          sudo bash -c 'source /etc/lsb-release && echo "
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME} main universe
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME}-updates main universe
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME}-backports main universe
          # This only seems to be required on GitHub images
          deb [arch=amd64,i386] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu ${DISTRIB_CODENAME} main

          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${DISTRIB_CODENAME} main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${DISTRIB_CODENAME}-updates main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${DISTRIB_CODENAME}-backports main universe
          # This only seems to be required on GitHub images
          deb [arch=arm64,armhf] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu ${DISTRIB_CODENAME} main
          " > /etc/apt/sources.list'

          sudo dpkg --add-architecture arm64
          sudo apt update -m

          sudo apt install -qy \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu

          sudo apt install -qy \
            extra-cmake-modules \
            wayland-protocols \
            libx11-dev:arm64 \
            libxtst-dev:arm64 \
            libxt-dev:arm64 \
            libxrandr-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libxkbcommon-x11-dev:arm64 \
            libxkbfile-dev:arm64 \
            libinput-dev:arm64 \
            libudev-dev:arm64 \
            libwayland-dev:arm64

      - name: Compile
        env:
          CC: aarch64-linux-gnu-gcc
          CFLAGS: "-Os -march=armv8-a+crc -mtune=cortex-a53 -g -flto -fomit-frame-pointer -fno-stack-protector -pipe"
          LDFLAGS: "-fuse-ld=gold -Wl,-O1 -Wl,--as-needed"
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/arm64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: ${{github.workspace}}/dist/**/*

  linux-x86:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo rm -Rf /etc/apt/sources.list.d
          sudo bash -c 'source /etc/lsb-release && echo "
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME} main universe
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME}-updates main universe
          deb [arch=amd64,i386] http://us.archive.ubuntu.com/ubuntu ${DISTRIB_CODENAME}-backports main universe
          # This only seems to be required on GitHub images
          deb [arch=amd64,i386] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu ${DISTRIB_CODENAME} main
          " > /etc/apt/sources.list'

          sudo dpkg --add-architecture i386
          sudo apt update -m

          sudo apt install -qy \
            binutils-i686-linux-gnu \
            gcc-i686-linux-gnu

          sudo apt install -qy \
            extra-cmake-modules \
            wayland-protocols \
            libx11-dev:i386 \
            libxtst-dev:i386 \
            libxt-dev:i386 \
            libxrandr-dev:i386 \
            libx11-xcb-dev:i386 \
            libxkbcommon-dev:i386 \
            libxkbcommon-x11-dev:i386 \
            libxkbfile-dev:i386 \
            libinput-dev:i386 \
            libudev-dev:i386 \
            libwayland-dev:i386

      - name: Compile
        env:
          CC: i686-linux-gnu-gcc
          CFLAGS: "-O2 -march=i686 -mtune=generic -g -fomit-frame-pointer -flto -fno-stack-protector -pipe"
          LDFLAGS: "-fuse-ld=gold -Wl,-O1 -Wl,--as-needed"
          PKG_CONFIG_PATH: "/usr/lib/i386-linux-gnu/pkgconfig"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/x86 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86
          path: ${{github.workspace}}/dist/**/*

  linux-x86_64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo apt update -m

          sudo apt install -qy \
            extra-cmake-modules \
            wayland-protocols \
            libx11-dev:amd64 \
            libxtst-dev:amd64 \
            libxt-dev:amd64 \
            libxrandr-dev:amd64 \
            libx11-xcb-dev:amd64 \
            libxkbcommon-dev:amd64 \
            libxkbcommon-x11-dev:amd64 \
            libxkbfile-dev:amd64 \
            libinput-dev:amd64 \
            libudev-dev:amd64 \
            libwayland-dev:amd64

      - name: Compile
        env:
          CC: x86_64-linux-gnu-gcc
          CFLAGS: "-O2 -march=x86-64 -mtune=generic -g -fomit-frame-pointer -flto -fno-stack-protector -pipe"
          LDFLAGS: "-fuse-ld=gold -Wl,-O1 -Wl,--as-needed"
          PKG_CONFIG_PATH: "/usr/lib/x86_64-linux-gnu/pkgconfig"
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/x86_64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: ${{github.workspace}}/dist/**/*

  windows-arm64:
    runs-on: windows-11-vs2026-arm

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: arm64

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -G "Visual Studio 18 2026" -A ARM64 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\arm64 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: ${{github.workspace}}/dist/**/*

  windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64_x86

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -G "Visual Studio 18 2026" -A Win32 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\x86 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86
          path: ${{github.workspace}}/dist/**/*

  windows-x86_64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -G "Visual Studio 18 2026" -A x64 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\x86_64 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: ${{github.workspace}}/dist/**/*

  merge-artifacts:
    runs-on: windows-latest

    needs:
      - catalyst-arm64
      - catalyst-x86_64
      - macos-arm64
      - macos-x86_64
      - linux-arm
      - linux-arm64
      - linux-x86
      - linux-x86_64
      - windows-arm64
      - windows-x86
      - windows-x86_64

    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: libuiohook-build
          delete-merged: true
